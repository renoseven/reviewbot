# Example machine config. Copy out of the repo and point --config at the copy.
# api_key / api_token are names or paths, never the secret itself.
# `reviewbot --config examples/reviewbot.toml config check` is valid with
# dummy env values (DEEPSEEK_API_KEY, GITLAB_TOKEN). It does not check that
# a [[tool]] bin exists on this machine; the binary must be there for a
# real review that calls the tool.

# Diagnostics. Every tracing line goes to <run dir>/log and nowhere else --
# never to stdout or stderr -- appended, so re-entering a run keeps the earlier
# attempt. `run show` prints the path. RUST_LOG still overrides this.
# Left out of the run fingerprint on purpose: turning the log up must not
# invalidate the checkpoints of a run already under way.
[log]
level = "info"                # error | warn | info | debug | trace

# Code hosts. The input URL's host picks the row.
[[platform]]
host = "gitlab.com"
base_url = "https://gitlab.com/api/v4"
api_token = "GITLAB_TOKEN"

[[platform]]
host = "github.com"
base_url = "https://api.github.com"
api_token = "~/.config/github_token"

# One vendor: protocol, key, currency, and the run budget.
[[provider]]
name = "deepseek"
protocol = "openai"
base_url = "https://api.deepseek.com"
api_key = "~/.config/deepseek_api_key"
currency = "CNY"
budget_per_run = -1

# Model catalog. Prices and limits travel with the entry; --model switches all of them.
[[model]]
name = "deepseek-v4-flash"
default = true
provider = "deepseek"
input_per_1m_tokens = 3.0
cached_input_per_1m_tokens = 0.10
output_per_1m_tokens = 9.0
context_window_tokens = 1000000
max_output_tokens = 384000
reasoning_effort = "none"

[[model]]
name = "deepseek-v4-pro"
provider = "deepseek"
input_per_1m_tokens = 9.0
cached_input_per_1m_tokens = 0.30
output_per_1m_tokens = 27.0
context_window_tokens = 1000000
max_output_tokens = 384000

# Every number below is required. None of them has an answer that holds
# across models and repositories, so there are no builtin defaults: reviewbot
# refuses to start rather than guess on your behalf.

# What to skip and how big one review turn is. Cost policy, not a hard deny.
[triage]
# Working size of one review turn, clamped down to whatever the window has
# room for. The leftover context window is only a hard ceiling, not this.
max_chunk_tokens = 24000
# A file bigger than this is skipped and named in the report.
skip_files_over_bytes = 262144
skip_paths = ["**/*.lock", "vendor/**"]

# What the review stage's tools may hand back. How many rounds the tool loop
# gets is not here: that is whatever the model's window affords once the diff
# has taken its share, worked out per run rather than guessed by hand. Which
# model to use is on [[model]].
[review]
# How much one listing or one search may hand back. Both numbers appear in
# the tool descriptions the model reads, so they cannot drift apart from
# what the code enforces.
max_files_per_listing = 200
max_hits_per_search = 50
# The most of one file a read may fetch. This bounds the fetch, not the
# answer: the platform API has no range request, so reading part of a file
# means downloading all of it, and a file past this cannot be read at all.
# Not a permission -- whether a path may be read at all is [security].
max_file_bytes = 262144
# What one tool answer may hand back. A fact about tools rather than about
# the window: how much diagnostic output is worth reading does not change with
# the model. What a whole round may add up to is derived. A file read that does not
# fit is refused with its size rather than truncated, so the model can ask
# for a line range instead of judging half a file without knowing.
max_tool_output_bytes = 32768

# What may be touched at all. Permissions only: nothing here is a size, and
# no command line flag may override any of it.
[security]
deny_paths = ["secrets/**", "**/*.tfvars"]
# No builtin list: files outside it are not reviewed, and the read-a-file
# tools refuse them again. A whitelist, so extensionless files (Makefile,
# Dockerfile) stay unreadable.
allow_extensions = [
    "c", "h", "cc", "cpp", "cxx", "hpp", "hh", "hxx",
    "rs", "go", "java", "kt", "kts", "scala", "cs", "swift", "zig",
    "m", "mm",
    "py", "pyi", "rb", "php", "lua", "pl", "sh",
    "js", "mjs", "cjs", "jsx", "ts", "mts", "cts", "tsx", "vue", "svelte",
    "html", "htm", "xhtml", "hbs", "ejs", "njk", "twig", "erb", "pug",
    "css", "scss",
    "sql", "proto", "dart", "ex", "exs", "hs",
    "toml", "cmake", "tf", "nix",
]
# requires_build tools also need allow_build_tools = true and a sandbox.
allow_build_tools = false

# External checkers. Listed means enabled. Builtins are not declared here.
# The bin must exist for a real review; `config check` does not verify that.

# One file on its own. No compile, no checkout: answerable either way.
[[tool]]
name = "cppcheck"
description = "static analysis for one C/C++ file: memory, bounds, uninitialized values (no compile)"
bin = "/usr/bin/cppcheck"
args = ["--enable=warning,style", "--template=gcc", "--quiet", "--", "{path}"]
params.path = { type = "path" }
requires_checkout = false
requires_build = false
timeout_ms = 60000

# The brief's named "add a tool" demo: another [[tool]] row, no recompile.
# Needs the whole project: a lone .c file without headers is a screen of
# missing includes, worse than not running. Still offered to the model without
# --worktree; the description says it is unavailable and the call is refused.
[[tool]]
name = "typecheck"
description = "type-check one C file with gcc -fsyntax-only (no object file)"
bin = "/usr/bin/gcc"
args = ["-Wall", "-Wextra", "-fsyntax-only", "--", "{path}"]
params.path = { type = "path" }
requires_checkout = true
requires_build = false
timeout_ms = 60000
