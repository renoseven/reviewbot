[review]
max_tool_rounds = 12
max_files_listed = 200
max_search_hits = 50
max_read_bytes = 262144
max_tool_output_bytes = 65536

[[provider]]
name = "deepseek"
protocol = "openai"
base_url = "https://api.deepseek.com"
api_key = "DEEPSEEK_API_KEY"
currency = "CNY"
budget = 10.0

[[model]]
name = "deepseek-v4-flash"
default = true
provider = "deepseek"
input_per_1m = 3.0
cached_input_per_1m = 0.10
output_per_1m = 9.0
context_window = 1000000
max_output_tokens = 384000

[[model]]
name = "deepseek-v4-pro"
provider = "deepseek"
input_per_1m = 9.0
cached_input_per_1m = 0.30
output_per_1m = 27.0
context_window = 1000000
max_output_tokens = 384000

[[platform]]
host = "gitlab.com"
base_url = "https://gitlab.com/api/v4"
api_token = "GITLAB_TOKEN"

[triage]
max_chunk_tokens = 24000
skip_over_bytes = 262144
skip_paths = ["**/*.lock", "vendor/**"]

[security]
deny_paths = ["secrets/**", "**/*.tfvars"]
allow_extensions = ["c", "h", "rs", "toml", "md"]

[[tool]]
name = "gcc"
description = "compile one C file with warnings, no object file (gcc -fsyntax-only)"
bin = "/usr/bin/gcc"
args = ["-Wall", "-Wextra", "-fsyntax-only", "--", "{path}"]
params.path = { type = "path" }
requires_worktree = true
timeout_ms = 60000
