[review]
max_files_per_listing = 200
max_hits_per_search = 50
max_files_per_fetch = 20
max_file_bytes = 262144
max_tool_output_bytes = 65536
max_rounds = 100

[[provider]]
name = "deepseek"
protocol = "openai"
base_url = "https://api.deepseek.com"
api_key = "DEEPSEEK_API_KEY"
currency = "CNY"
budget_per_run = 10.0

[[model]]
name = "deepseek-v4-flash"
default = true
provider = "deepseek"
input_per_1m_tokens = 2.0
cached_input_per_1m_tokens = 0.04
output_per_1m_tokens = 8.0
context_window_tokens = 1000000
max_output_tokens = 384000

[[model]]
name = "deepseek-v4-pro"
provider = "deepseek"
input_per_1m_tokens = 9.0
cached_input_per_1m_tokens = 0.30
output_per_1m_tokens = 27.0
context_window_tokens = 1000000
max_output_tokens = 384000

[[platform]]
base_url = "https://gitlab.com/api/v4"
api_token = "GITLAB_TOKEN"

[plan]
max_chunk_tokens = 24000
skip_files_over_bytes = 262144
skip_paths = ["**/*.lock", "vendor/**"]

[security]
deny_paths = ["secrets/**", "**/*.tfvars"]
allow_extensions = [
    "c", "h", "cc", "cpp", "cxx", "hpp", "hh", "hxx",
    "rs", "go", "java", "kt", "kts", "scala", "cs", "swift", "zig",
    "m", "mm",
    "py", "pyi", "rb", "php", "lua", "pl", "sh",
    "js", "mjs", "cjs", "jsx", "ts", "mts", "cts", "tsx", "vue", "svelte",
    "html", "htm", "xhtml", "hbs", "ejs", "njk", "twig", "erb", "pug",
    "css", "scss",
    "sql", "proto", "dart", "ex", "exs", "hs",
    "toml", "cmake", "tf", "nix",
]

[[tool]]
name = "cppcheck"
description = "static analysis for one C/C++ file: memory, bounds, uninitialized values (no compile). The path must be a C or C++ file; do not call this for any other language."
bin = "/usr/bin/cppcheck"
args = ["--enable=warning,style", "--template=gcc", "--quiet", "{path}"]
params.path = { type = "path", description = "a C or C++ file; do not pass a path in any other language" }
requires_checkout = false
requires_build = false
timeout_ms = 60000

[[tool]]
name = "typecheck"
description = "type-check one C file with gcc -fsyntax-only (no object file). The path must be a C source or header; do not call this for any other language."
bin = "/usr/bin/gcc"
args = ["-Wall", "-Wextra", "-fsyntax-only", "{path}"]
params.path = { type = "path", description = "a C source or header; do not pass a path in any other language" }
requires_checkout = true
requires_build = false
timeout_ms = 60000
