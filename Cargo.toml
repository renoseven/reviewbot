[package]
name = "reviewbot"
version = "0.1.0"
edition = "2024"
description = "A code review agent"
license = "MIT OR Apache-2.0"

[lib]
name = "reviewbot"
path = "src/lib.rs"

[[bin]]
name = "reviewbot"
path = "src/main.rs"

[dependencies]
bitflags = "2"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
regex = "1"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
