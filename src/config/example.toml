# Generated by `reviewbot config init`.
# Written to --config or ~/.reviewbot/config.toml.
# A complete starting point you can edit.

# How verbose the run log is.
# Lines go to <run dir>/log.
[log]
level = "info"    # error | warn | info | debug | trace

# Code hosts this config can review.
# The input URL's host picks the row.
[[platform]]
base_url = "https://gitlab.com/api/v4"  # known API: gitlab.com or api.github.com
api_token = "GITLAB_TOKEN"              # env name, or a path

[[platform]]
base_url = "https://api.github.com"
api_token = "GITHUB_TOKEN"

# Vendor accounts the models call.
# `name` is what [[model]].provider points at.
[[provider]]
name = "deepseek"                      # unique. [[model]].provider must match this
protocol = "openai"                    # currently the only known protocol
base_url = "https://api.deepseek.com"  # vendor chat API
api_key = "DEEPSEEK_API_KEY"           # env name, or a path
currency = "CNY"                       # display label for amounts; any short string
budget_per_run = -1                    # -1 unlimited | 0 spend nothing | > 0 cap for one run

# Models `--model` can select.
# Prices and limits travel with the entry.
[[model]]
name = "deepseek-flash"            # vendor model name, as the API expects it
alias = "deepseek-v4-flash"        # optional; --model accepts name or alias
default = true                     # true | false. At most one model may set true
provider = "deepseek"              # must match a [[provider]].name
input_per_1m_tokens = 2.0          # price of 1e6 input tokens, in [[provider]].currency
cached_input_per_1m_tokens = 0.04  # optional; omit when unused
output_per_1m_tokens = 8.0         # price of 1e6 output tokens, same currency
context_window_tokens = 1000000    # must be > max_output_tokens + 4096
max_output_tokens = 384000         # most tokens one completion may emit
reasoning_effort = "low"           # none | minimal | low | medium | high | xhigh | max
                                   # omit to leave the vendor default

[[model]]
name = "deepseek-v4-pro"
provider = "deepseek"
input_per_1m_tokens = 9.0
cached_input_per_1m_tokens = 0.30
output_per_1m_tokens = 27.0
context_window_tokens = 1000000
max_output_tokens = 384000
reasoning_effort = "low"

# Which files to skip, and the size of one review turn.
# Skipped files are named in the report.
[plan]
max_chunk_tokens = 24000                # working size of one review turn, in tokens
skip_files_over_bytes = 262144          # larger files are skipped and named in the report
skip_paths = ["**/*.lock", "vendor/**"] # globs; skipped and named in the report
skip_generated = true                   # true | false. Default true.

# How much a review-stage tool may return.
# Listings, searches, file reads, and one tool answer.
[review]
max_files_per_listing = 200   # paths one listing call may return
max_hits_per_search = 50      # hits one search call may return
max_files_per_fetch = 20      # paths one fetch_repo_file call may pull
max_file_bytes = 262144       # most of one file a read may fetch
                              # a read takes the whole file; a larger file is refused
max_tool_output_bytes = 32768 # most one tool answer may hand back
max_rounds = 100              # investigation rounds one file may take
                              # the conversation also stops when the next call no longer fits

# What may be touched.
# A whitelist and a deny list; sizes live under [review].
[security]
deny_paths = ["secrets/**", "**/*.tfvars"] # globs; a match is refused
allow_extensions = [                       # required, non-empty whitelist. Bare names (`rs`).
    "c", "h", "cc", "cpp", "cxx", "hpp", "hh", "hxx",
    "rs", "go", "java", "kt", "kts", "scala", "cs", "swift", "zig",
    "m", "mm",
    "py", "pyi", "rb", "php", "lua", "pl", "sh",
    "js", "mjs", "cjs", "jsx", "ts", "mts", "cts", "tsx", "vue", "svelte",
    "html", "htm", "xhtml", "hbs", "ejs", "njk", "twig", "erb", "pug",
    "css", "scss",
    "sql", "proto", "dart", "ex", "exs", "hs",
    "toml", "cmake", "tf", "nix",
]
follow_symlinks = false                    # true | false. Default false.
allow_build_tools = false                  # true | false. `requires_build` tools also need a sandbox.

# External checkers offered to the model.
# Uncomment a block to enable it.
#
# Every [[tool]] field:
#   name               unique among tools and builtins
#   description        what the model reads to decide when to call
#   bin                absolute path of the executable
#   args               argv array, execve
#   params.<key>       one argument the model may fill
#     type             path | string | integer | number | boolean
#     description      optional. What the model reads for that argument
#     pattern          regex; a string needs this or enum
#     enum             allowed values; a string needs this or pattern
#   requires_checkout  true | false. Needs the whole project
#   requires_build     true | false. Needs allow_build_tools and a sandbox
#   timeout_ms         milliseconds. Default 60000 if omitted

